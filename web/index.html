<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PadBench</title>
  <meta name="description" content="DualSense tester and refurbishment database">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="lightbar" id="lightbar"></div>
  <div class="frame">
    <nav class="rail" aria-label="Main">
      <div class="brand">PadBench</div>
      <a href="#/test" data-nav="test">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12a4 4 0 0 1 4 4l-.6 4.2a2.6 2.6 0 0 1-4.6 1.3L15 15H9l-1.8 2.5a2.6 2.6 0 0 1-4.6-1.3L2 12a4 4 0 0 1 4-4Z"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16.5" cy="11.5" r=".6" fill="currentColor"/><circle cx="18" cy="13" r=".6" fill="currentColor"/></svg>
        Test
      </a>
      <a href="#/db" data-nav="db">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="8" ry="2.8"/><path d="M4 5.5v6.5c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8V5.5M4 12v6.5c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8V12"/></svg>
        Controllers
      </a>
      <a href="#/settings" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        Sync
      </a>
      <div class="spacer"></div>
      <button class="sync-dot" id="syncdot" data-state="idle" title="Sync status"><i></i><span>Local</span></button>
    </nav>
    <main id="view"></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
